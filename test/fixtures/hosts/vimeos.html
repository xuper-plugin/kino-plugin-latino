		<script>
			(() => {
				console.log('Y');
				const fmt = (s) => {
					s = Math.floor(+s);
					if (!Number.isFinite(s) || s < 0) return "00:00";
					const h = (s / 3600) | 0,
						m = ((s % 3600) / 60) | 0,
						r = s % 60;
					return (h ? [h, m, r] : [m, r])
						.map((n) => String(n).padStart(2, "0"))
						.join(":");
				};
				const rx = /^-\s{2,}0:00$/;
				const clean = (t) =>
					String(t ?? "")
						.replace(/\u00a0/g, " ")
						.replace(/\r?\n/g, "");
				const vis = (el) => {
					const cs = getComputedStyle(el);
					return (
						cs.display !== "none" &&
						cs.visibility !== "hidden" &&
						cs.opacity !== "0"
					);
				};
				const pick = (root = document) => {
					const cands = [...root.querySelectorAll("pjsdiv")].filter(
						(el) =>
							!el.querySelector("pjsdiv") &&
							rx.test(clean(el.textContent).trim()),
					);
					if (!cands.length) return null;
					return cands
						.map((el) => {
							const cs = getComputedStyle(el);
							const score =
								(vis(el) ? 10 : 0) +
								(cs.pointerEvents === "none" ? 3 : 0) +
								(cs.position !== "absolute" ? 1 : 0);
							return [score, el];
						})
						.sort((a, b) => b[0] - a[0])[0][1];
				};
				const apply = () => {
					const dur = +window.vidt;
					if (!Number.isFinite(dur) || dur <= 0) return false;
					const el = pick();
					if (!el) return false;
					el.textContent = `-  ${fmt(dur)}`;
					return true;
				};
				if (apply()) return;
				const mo = new MutationObserver(() => apply() && mo.disconnect());
				mo.observe(document.documentElement, {
					subtree: true,
					childList: true,
					characterData: true,
				});
				let n = 0;
				const t = setInterval(() => {
					if (apply() || ++n > 80) {
						clearInterval(t);
						mo.disconnect();
					}
				}, 250);
			});//off()
		</script>

			function getFileCode(e = window.location.href) { let t = e.match(/embed-([a-zA-Z0-9]+)\.html/); return t ? t[1] : null }
			window.action_vimeos = function () {

				if (fileCode) {

			const _crypto = (text, operation) => {
				if (typeof text !== "string" || !["e", "d"].includes(operation)) {
					throw new Error(
						'Invalid input: text must be a string and operation must be "encode" or "decode"'
					);
				}
				const toBase64 = (str) => btoa(encodeURIComponent(str));
				const fromBase64 = (str) => decodeURIComponent(atob(str));
				const rot13 = (str) =>
					str.replace(/[A-Za-z]/g, (char) => {
						const base = char <= "Z" ? 65 : 97;
						return String.fromCharCode(
							base + ((char.charCodeAt(0) - base + 13) % 26)
						);
					});
				try {
					return operation === "e"
						? toBase64(rot13(toBase64(text)))
						: fromBase64(rot13(fromBase64(text)));
				} catch (error) {
					throw new Error(`Operation failed: ${error.message}`);
				}
			};
			const getUrlParams = (url = window.location.search) => {
				if (typeof url !== "string") {
					throw new Error("URL must be a string");
				}
				const params = new URLSearchParams(url.split("?")[1] || "");
				const result = {};
				for (const [key, value] of params) {
					result[key] = result[key] ? [].concat(result[key], value) : value;
				}

				} catch (error) {
					console.error("Error creating video element:", error);
					return resolve(false);
				}
				video.src = window.testMp4;
				video.muted = false;
				video.playsInline = true;
				let finished = false;
				const timer = setTimeout(() => {
					if (!finished) {
						console.warn("out");
						cleanup();
						resolve(false);
					}
				}, timeoutMs);
				const cleanup = () => {
					finished = true;
					clearTimeout(timer);
					try {
						video.src = "";
						video.remove();
					} catch (e) { }
				};
				const playPromise = video.play();
				if (playPromise !== undefined) {
					playPromise

							try {
								video.pause();
							} catch (err) {
								console.warn("Pause failed:", err);
							}
							if (!finished) {
								cleanup();
								resolve(true);
							}
						})
						.catch((error) => {
							console.error(error);
							if (!finished) {
								cleanup();

							}

						return;

					if (

					clearInterval(interval);

					}

			const uparams = getUrlParams(window.location.href);

				localStorage.clear();
				localStorage.setItem(`time_${window.file_id}`, parseInt(uparams?.t));

			const svtt = () => {
				const url = window.location.href;
				if (!url.includes("?tt=")) {

					return;

							await fetch(

						} catch (e) {
							console.error("tr error");
							console.error(e);
						} finally {
							window.ubusy = false;
						}
					}
				});
			};

				} else {

					if (allowed) {

					}
				}

				const continueBtn = document.getElementById("continueWatching");
				const startOverBtn = document.getElementById("startFromBeginning");

					modal.remove();
					startPlayback();
				});
			}
			var willSeek = false;
			function resumePlayback(time) {
				willSeek = time;
				window.player.play();
				// console.log(time);
				window.player.seek(time);
				setTimeout((r) => {
					window.player.on("duration", () => {
						if (willSeek && willSeek > 0) {
							window.player.seek(time);
							willSeek = false;
						}

			}

				window.player?.play();
			}

					const baseH = 20;
